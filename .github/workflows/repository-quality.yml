name: Repository Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependency
        run: python -m pip install --upgrade pip PyYAML

      - name: Validate repository structure and examples
        run: python tools/validate_repo.py

      - name: Validate agent mode metadata
        run: python tools/validate_agent_modes.py

      - name: Validate multilingual knowledge base
        run: python tools/validate_knowledge_base.py
